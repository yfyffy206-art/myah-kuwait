    <script>
        // لا منتجات مضمّنة في الملف الثابت — تُعرض المنتجات من قاعدة البيانات فقط.
        const defaultProducts = [];

        function initializeDefaultProducts() {
            // ملف المشروع المولّد (LOCAL_PRODUCTS) هو اللقطة الموثوقة المولّدة من
            // قاعدة البيانات؛ نستخدمه بدل نسخة المتصفح التي قد تحمل بيانات قديمة
            // أو عالقة. عند غيابه نرجع للمخزّن ثم للقائمة الافتراضية.
            const fromFile = Array.isArray(window.LOCAL_PRODUCTS) ? window.LOCAL_PRODUCTS : [];
            let stored = [];
            try { stored = JSON.parse(localStorage.getItem('allProducts')) || []; } catch (e) {}
            const source = fromFile.length ? fromFile : (stored.length ? stored : defaultProducts);
            localStorage.setItem('allProducts', JSON.stringify(source));
        }

        // رابط صفحة المنتج الديناميكية (SEO) — /product/<id>/<slug>
        // ترجمة صوتية للعربية — تطابق slugify() في product_page.py تماماً
        // ليتطابق رابط الموقع مع اسم ملف الصفحة الثابتة على Netlify.
        const AR_TRANSLIT = { 'ا':'a','أ':'a','إ':'a','آ':'a','ٱ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'dh','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ى':'a','ة':'h','ء':'','ئ':'y','ؤ':'w','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
        function slugifyName(name) {
            let t = '';
            for (const ch of (name || '')) t += (AR_TRANSLIT[ch] !== undefined ? AR_TRANSLIT[ch] : ch);
            t = t.replace(/[^A-Za-z0-9\s-]/g, '').trim().toLowerCase().replace(/[\s_]+/g, '-');
            return t || 'product';
        }

        // رابط صفحة المنتج الثابتة (SEO) — /product/<id>/<slug> بصيغة ASCII فقط
        // (بلا ترميز percent) ليعمل على Netlify دون خلل الروابط العربية.
        function productPageUrl(product) {
            if (!product._id) return null;
            return '/product/' + product._id + '/' + slugifyName(product.name);
        }

        // مسار صورة مطلق دائماً: يعمل من الصفحة الرئيسية ومن أي رابط عميق
        // (صفحات المنتجات على الاستضافة الثابتة قد تُخدَم من /product/<id>/<slug>)
        function absImg(img) {
            if (!img) return '/assets/images/nfc2.png';
            if (/^(https?:|data:|\/)/.test(img)) return img;
            return '/' + img.replace(/^\.?\//, '');
        }

        // فتح/إغلاق درج القائمة
        function toggleMenu(open) {
            const drawer = document.getElementById('menuDrawer');
            const overlay = document.getElementById('menuOverlay');
            const show = (typeof open === 'boolean') ? open : !drawer.classList.contains('open');
            drawer.classList.toggle('open', show);
            overlay.classList.toggle('open', show);
            document.body.style.overflow = show ? 'hidden' : '';
        }
        document.getElementById('menuBtn').addEventListener('click', function () { toggleMenu(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggleMenu(false); });

        // تعبئة منتجات القائمة (ديناميكية مع كل تحديث للمنتجات)
        function renderMenuProducts(allProducts) {
            const box = document.getElementById('menuProducts');
            if (!box) return;
            box.innerHTML = allProducts.map(function (product) {
                const url = productPageUrl(product);
                if (!url) return '';
                const img = absImg(product.img);
                return `<a class="menu-link" href="${url}">
                    <img src="${img}" alt="" loading="lazy">
                    <span>${product.name}</span>
                    <span class="m-price">${product.price} د.ك</span>
                </a>`;
            }).join('');
        }

        // منتج صالح للعرض: اسم + صورة + سعر
        function isValidProduct(product) {
            return !!(product && product.name && product.img && product.price);
        }

        // لا تُستبدل القائمة المحلية إلا بمصدر غير فارغ وكل عناصره صالحة
        function usableProducts(list) {
            return Array.isArray(list) && list.length > 0 && list.every(isValidProduct);
        }

        // بصمة قائمة المنتجات: تمنع إعادة رسم الشبكة (الوميض) عند وصول نفس
        // القائمة من المزامنة/onSnapshot بعد العرض الفوري المحلي.
        let __productsSig = null;
        function productsSignature(list) {
            return list.map(function (p) {
                return [p._id || '', p.name || '', p.price || '', p.desc || '', p.img || ''].join('|');
            }).join('\n');
        }

        function renderProducts(allProducts) {
            if (!usableProducts(allProducts)) return; // لا تمسح العرض الحالي بمصدر ناقص
            const sig = productsSignature(allProducts);
            if (sig === __productsSig) return; // نفس القائمة المعروضة → لا إعادة رسم
            __productsSig = sig;
            const grid = document.getElementById('productsGrid');
            renderMenuProducts(allProducts);
            if (!grid) return;
            grid.innerHTML = allProducts.map((product, index) => {
                const url = productPageUrl(product);
                const imgSrc = absImg(product.img);
                const nameHtml = url
                    ? `<a href="${url}" style="color:inherit;text-decoration:none">${product.name}</a>`
                    : product.name;
                const imgHtml = url
                    ? `<a href="${url}"><img src="${imgSrc}" alt="${product.name}"></a>`
                    : `<img src="${imgSrc}" alt="${product.name}">`;
                return `
                <div class="ProductCard" data-price="${product.price}" data-name="${product.name}" data-desc="${(product.desc||'').replace(/"/g,'&quot;')}" data-img="${imgSrc}">
                    <div class="ProductInfo">
                        <h3 class="ProductName">${nameHtml}</h3>
                        <p class="ProductDesc">${product.desc}</p>
                        <div class="ProductPrice">${product.price} د.ك</div>
                    </div>
                    <div class="ProductImageWrapper">${imgHtml}</div>
                    <button class="AddButton" onclick="updateQuantity(this, 1)">إضافة</button>
                </div>`;
            }).join('');
            // استعادة الكميات المحفوظة في السلة بعد رسم البطاقات
            restoreQuantitiesFromCart();
        }

        // ── العرض الفوري: من ملفات المشروع المحلية، بدون انتظار الشبكة ──
        function getLocalProducts() {
            if (Array.isArray(window.LOCAL_PRODUCTS) && window.LOCAL_PRODUCTS.length) {
                return window.LOCAL_PRODUCTS;
            }
            try {
                const stored = JSON.parse(localStorage.getItem('allProducts')) || [];
                if (stored.length) return stored;
            } catch (e) {}
            return defaultProducts;
        }

        // ── المزامنة: تجلب أحدث المنتجات من قاعدة البيانات وتُحدّث العرض في الخلفية ──
        async function syncProductsFromDatabase() {
            try {
                if (typeof window.storeGetProducts === 'function') {
                    const remote = await window.storeGetProducts();
                    if (remote && remote.length) renderProducts(remote);
                }
                if (typeof window.storeWatchProducts === 'function') {
                    window.storeWatchProducts(function (items) { renderProducts(items); });
                }
            } catch (e) {
                console.warn('products sync failed, keeping local view:', e);
            }
        }

        // 1) عرض فوري أثناء تحليل الصفحة — لا ينتظر سكربتات Firebase ولا DOMContentLoaded
        initializeDefaultProducts();
        renderProducts(getLocalProducts());
        calculateTotal();

        // 2) ثم زامن من قاعدة البيانات في الخلفية (المزامنة تبقى قائمة)
        document.addEventListener('DOMContentLoaded', function () {
            // cart.js محمّل الآن: أعِد استعادة كميات السلة
            restoreQuantitiesFromCart();
            syncProductsFromDatabase();
        });

        // استعادة الكميات المحفوظة في السلة بعد إعادة رسم المنتجات
        function restoreQuantitiesFromCart() {
            const cart = window.CartGet ? window.CartGet() : [];
            const cartMap = {};
            cart.forEach(function (item) { cartMap[item.name] = item.qty; });

            document.querySelectorAll('.ProductCard').forEach(function (card) {
                const name = card.getAttribute('data-name');
                const savedQty = cartMap[name];
                if (savedQty && savedQty > 0) {
                    const addBtn = card.querySelector('.AddButton');
                    if (addBtn) {
                        const controller = document.createElement('div');
                        controller.className = 'QuantityController';
                        controller.innerHTML = `
                            <button onclick="adjustQty(this, -1)">-</button>
                            <span class="qty-val">${savedQty}</span>
                            <button onclick="adjustQty(this, 1)">+</button>
                        `;
                        addBtn.replaceWith(controller);
                    }
                }
            });
            calculateTotal();
        }

        function getProductFromCard(card) {
            return {
                name: card.getAttribute('data-name'),
                desc: card.getAttribute('data-desc') || '',
                price: card.getAttribute('data-price'),
                img: card.getAttribute('data-img') || ''
            };
        }

        function updateQuantity(buttonElement, change) {
            const card = buttonElement.closest('.ProductCard');
            const product = getProductFromCard(card);
            let controller = card.querySelector('.QuantityController');
            
            if (!controller) {
                // أول إضافة: احفظ في السلة وأنشئ أداة التحكم بالكمية
                if (window.CartAdd) window.CartAdd(product, 1);
                controller = document.createElement('div');
                controller.className = 'QuantityController';
                controller.innerHTML = `
                    <button onclick="adjustQty(this, -1)">-</button>
                    <span class="qty-val">1</span>
                    <button onclick="adjustQty(this, 1)">+</button>
                `;
                buttonElement.replaceWith(controller);
            }
            calculateTotal();
        }

        function adjustQty(btn, change) {
            const card = btn.closest('.ProductCard');
            const product = getProductFromCard(card);
            const controller = btn.closest('.QuantityController');
            const qtySpan = controller.querySelector('.qty-val');
            let currentQty = parseInt(qtySpan.textContent) + change;
            
            if (currentQty <= 0) {
                // حذف المنتج من السلة وإعادة زر "إضافة"
                if (window.CartRemove) window.CartRemove(product.name);
                const newAddBtn = document.createElement('button');
                newAddBtn.className = 'AddButton';
                newAddBtn.textContent = 'إضافة';
                newAddBtn.setAttribute('onclick', 'updateQuantity(this, 1)');
                controller.replaceWith(newAddBtn);
            } else {
                // تحديث الكمية في السلة وفي الواجهة
                if (window.CartSetQty) window.CartSetQty(product.name, currentQty);
                qtySpan.textContent = currentQty;
            }
            calculateTotal();
        }

        function calculateTotal() {
            // احسب من السلة المخزّنة (المصدر الموثوق)
            let total = window.CartTotal ? window.CartTotal() : 0;
            let totalCount = window.CartCount ? window.CartCount() : 0;

            const formattedTotal = total.toFixed(3) + ' د.ك';
            document.getElementById('header-total').textContent = formattedTotal;
            document.getElementById('footer-total').textContent = formattedTotal;
            document.getElementById('footer-count').textContent = totalCount;

            const cartBar = document.getElementById('floating-cart-bar');
            const cartText = document.getElementById('cart-text-content');

            if (totalCount > 0) {
                cartBar.classList.add('active-cart');
                cartText.innerHTML = `<span>&#8249;</span> اذهب الى السلة`;
            } else {
                cartBar.classList.remove('active-cart');
                cartText.textContent = 'سلة المنتجات فارغة';
            }
        }

        function goToCart() {
            let totalCount = parseInt(document.getElementById('footer-count').textContent);
            if (totalCount > 0) {
                window.location.href = 'cartepage.html';
            }
        }
    </script>

    <!-- المسافة ووقت التوصيل الفعليان: من مستودعنا (ميناء الشويخ / المنطقة الحرة)
         إلى موقع الزائر، عبر OSRM (توجيه حقيقي على الطرق) + تحديد موقع الزائر. -->
    <script>
    (function () {
        var WAREHOUSE = { lat: 29.3490, lng: 47.9135 }; // Shuwaikh Port, Kuwait Free Trade Zone, WH12

        function setText(id, text) {
            var el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        // تقريب لطيف: 4.3 → 4.5 و4.4 → 4.5 و8.2 → 8 (أنصاف الكيلومترات)
        function roundKm(km) {
            var half = Math.round(km * 2) / 2;
            return (Math.abs(half - Math.round(half)) < 0.01) ? String(Math.round(half)) : half.toFixed(1);
        }

        function formatDistance(km) { return roundKm(km) + ' كم'; }

        // أقصى وقت توصيل معروض: يوم واحد. عند بلوغ هذا الحد تُعرض المسافة 23 كم.
        var MAX_DELIVERY_MIN = 1440; // يوم واحد بالدقائق
        var MAX_DISTANCE_KM = 23;    // المسافة المقابلة لأقصى وقت

        function cappedMinutes(min) {
            var m = Math.max(5, Math.round(min / 5) * 5);
            return m >= MAX_DELIVERY_MIN ? MAX_DELIVERY_MIN : m;
        }

        function formatDuration(min) {
            var m = cappedMinutes(min);
            if (m >= MAX_DELIVERY_MIN) return '1 يوم';
            if (m < 60) return m + ' دقيقة';
            var h = Math.floor(m / 60), r = m % 60;
            if (r === 0) return h + ' ساعة';
            return h + ' ساعة و' + r + ' دقيقة';
        }

        // مسار حقيقي على الطرق عبر OSRM (مفتوح، HTTPS + CORS)
        function route(origin, dest) {
            var url = 'https://router.project-osrm.org/route/v1/driving/' +
                origin.lng + ',' + origin.lat + ';' + dest.lng + ',' + dest.lat +
                '?overview=false';
            return fetch(url, { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (d) {
                    if (!d || d.code !== 'Ok' || !d.routes || !d.routes.length) return null;
                    return { km: d.routes[0].distance / 1000, min: d.routes[0].duration / 60 };
                })
                .catch(function () { return null; });
        }

        // تحديد موقع الزائر: أولاً عنوان IP (بلا إذن)، وإن فشل نجرّب GPS بدقة عالية
        function getVisitorLocation() {
            return fetch('https://ipwho.is/', { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (d) {
                    if (d && d.success !== false && d.latitude && d.longitude) {
                        return { lat: d.latitude, lng: d.longitude };
                    }
                    return null;
                })
                .catch(function () { return null; })
                .then(function (loc) {
                    if (loc) return loc;
                    return new Promise(function (resolve) {
                        if (!navigator.geolocation) return resolve(null);
                        navigator.geolocation.getCurrentPosition(
                            function (p) { resolve({ lat: p.coords.latitude, lng: p.coords.longitude }); },
                            function () { resolve(null); },
                            { enableHighAccuracy: true, timeout: 8000, maximumAge: 300000 }
                        );
                    });
                });
        }

        function applyResult(res) {
            if (!res) return;
            var atMax = cappedMinutes(res.min) >= MAX_DELIVERY_MIN;
            setText('distanceValue', atMax ? (MAX_DISTANCE_KM + ' كم') : formatDistance(res.km));
            setText('deliveryTimeValue', formatDuration(res.min));
            setText('deliveryTimeText', 'خلال ' + formatDuration(res.min));
        }

        getVisitorLocation().then(function (loc) {
            if (!loc) return; // نُبقي النص الافتراضي عند تعذّر تحديد الموقع
            return route(WAREHOUSE, loc).then(applyResult);
        });
    })();
    </script>
